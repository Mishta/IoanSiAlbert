<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/katex/katex.min.css">
<script defer src="assets/katex/katex.min.js"></script>
<script defer src="assets/katex/katex.min.js" onload="
  document.querySelectorAll('.math').forEach(el => {
    katex.render(el.dataset.tex, el, {throwOnError:false, displayMode:true});
  });
"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 420px;
    background: #0f131f;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
  }
  .wrap { width: 100%; text-align: center; padding: 0 80px; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(176,163,140,0.65);
    margin-bottom: 40px;
  }
  .math { color: #ffe3b7; }
  .math .katex { font-size: 3.2rem; }
  .line {
    width: 55%;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, #ffba20 50%, transparent 100%);
    margin: 44px auto 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">PUTERE INCIDENTĂ &nbsp;·&nbsp; Roi Dyson la 7,696 milioane km de Soare</div>
  <div class="math" data-tex="P_{\text{incident}} = I_{7{,}696M} \cdot A_{\text{total}} \;=\; 5{,}14 \times 10^5 \cdot 2{,}36 \times 10^7 \;\approx\; 1{,}21 \times 10^{13} \text{ W}"></div>
  <div class="line"></div>
</div>
<script>
window.addEventListener('load', () => {
  document.querySelectorAll('.math').forEach(el => {
    katex.render(el.dataset.tex, el, {throwOnError:false, displayMode:true});
  });
});
</script>
</body>
</html>
